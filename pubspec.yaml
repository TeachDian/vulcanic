name: vulcanic
description: "Interactive AR volcano with markerless and marker-based tracking."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  mobile_scanner: ^7.5.0
  qr: ^4.0.1
  vector_math: any


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/models/
    - assets/narration/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf

