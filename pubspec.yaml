name: vulcanic
description: "Interactive AR volcano with markerless and marker-based tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  vector_math: any


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/models/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf

